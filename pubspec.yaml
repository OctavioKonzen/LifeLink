name: magic
description: "LifeLink: contador de vida, busca de cartas, decks e preços de Magic: The Gathering."
publish_to: 'none'
version: 1.0.37+38

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  quick_actions: ^1.1.1
  qr_flutter: ^4.1.0
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/lifelink.png
    # Mesa de dados 3D (o mesmo motor do site; gerada com: cd web-site && npm run build:dice)
    - assets/dice/
    # Sons do contador (gerados com: python3 tool/make_sounds.py)
    - assets/sounds/
  # As fontes do redesign (as mesmas do site): Inter no texto, Cinzel nos
  # títulos. Só as letras latinas (gerado com o fonttools a partir do Google Fonts).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-600.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-700.ttf
          weight: 700
