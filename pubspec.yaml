name: magic
description: "Contador de vida, busca de cartas, decks e preços de Magic: The Gathering."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/database/
