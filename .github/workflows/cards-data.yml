# O banco de cartas e as imagens no Cloudflare R2 (tool/build_cards.py).
# Roda todo dia depois que a Scryfall atualiza os arquivos (por volta das
# 9h UTC). As imagens vão aos poucos: cada vez continua de onde parou.
name: Banco de cartas (R2)

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos para copiar imagens (0 = só o banco)'
        default: '300'

concurrency:
  group: cards-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Banco e imagens
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: lifelink
          MAX_MINUTES: ${{ github.event.inputs.minutes || '300' }}
        run: python3 tool/build_cards.py
      - name: Conferir no endereço público
        env:
          # A variável R2_PUBLIC_URL (ou o segredo com o mesmo nome).
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
        run: |
          if [ -z "$R2_PUBLIC_URL" ]; then echo "::warning::Sem R2_PUBLIC_URL (variável ou segredo): não deu para conferir."; exit 0; fi
          curl -fsS "$R2_PUBLIC_URL/data/meta.json"
          echo
          curl -fsS -o /dev/null -w 'cards.jsonl.gz: %{size_download} bytes\n' "$R2_PUBLIC_URL/data/cards.jsonl.gz"
