name: App Android (APK)

# Gera o APK assinado do app e publica em GitHub Releases, igual ao Pocketdex.
# Roda quando a versão do pubspec.yaml muda na main (ou pelo botão Run
# workflow em Actions → App Android (APK)). O app confere essa página ao
# abrir e oferece a atualização (lib/data/services/update_service.dart); o
# site tem o botão "Baixar o APK".
#
# Precisa destes secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   chave de assinatura (.jks) em base64
#   ANDROID_KEYSTORE_PASSWORD senha da chave
#   ANDROID_KEY_ALIAS         apelido da chave
#   ANDROID_KEY_PASSWORD      senha do apelido
#   GOOGLE_SERVICES_JSON      conteúdo do google-services.json (Firebase)
# Sem a chave, o APK é gerado só como teste e não é publicado (uma versão
# assinada com outra chave não instalaria por cima nas próximas).

on:
  push:
    branches: [main]
    paths: ['pubspec.yaml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão e secrets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "apk-$VERSION" > /dev/null 2>&1; then
            echo "A versão $VERSION já está publicada. Para publicar outra, aumente a versão no pubspec.yaml."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_REF" = 'refs/heads/main' ] && [ -n "$KEYSTORE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Falta a chave de assinatura (secrets ANDROID_*): o APK é gerado só como teste e não é publicado."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.skip == 'false'
        with:
          channel: stable
          cache: true

      - name: Conferir o app (análise e testes)
        if: steps.check.outputs.skip == 'false'
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Gerar APK assinado
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/magic.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/magic.jks"
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json
          else
            echo "::warning::Sem GOOGLE_SERVICES_JSON: o APK sai sem login (conta)."
          fi
          # Um APK por tipo de celular (bem menor que um com os dois):
          # Magic.apk para 64 bits (quase todos) e outro para os de 32 bits.
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Magic.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Magic_32bits.apk
          ls -lh Magic*.apk

      - name: Publicar versão
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # O nome fixo Magic.apk deixa o link
          # releases/latest/download/Magic.apk sempre apontando para a última.
          gh release create "apk-$VERSION" Magic.apk Magic_32bits.apk \
            --target "$(git rev-parse HEAD)" --title "Magic $VERSION" --notes "$(git log -1 --pretty=%B)" --latest
