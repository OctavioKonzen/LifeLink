# Confere se falta carta no banco do LifeLink, comparando com a Scryfall e o
# MTGJSON (tool/check_cards.py). Roda toda semana e quando pedir.
name: Conferir cartas

on:
  schedule:
    - cron: '41 12 * * 1'
  workflow_dispatch:
  push:
    paths:
      - tool/check_cards.py
      - .github/workflows/cards-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 ijson
      - name: Conferir
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: lifelink
        run: python3 tool/check_cards.py
