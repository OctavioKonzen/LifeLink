# Testa as regras do banco (firestore.rules) no simulador do Firebase sempre
# que elas mudam: nick único, nick fixo e dados de cada conta. Na main, depois
# dos testes, publica as regras no Firebase (precisa do segredo
# FIREBASE_SERVICE_ACCOUNT: a chave da conta de serviço do projeto, em JSON).
name: Regras do banco

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'tool/deploy_firestore_rules.py', 'tool/rules-test/**', 'web-site/src/lib/onlineCore.js', '.github/workflows/rules.yml']
  workflow_dispatch:
  pull_request:
    paths: ['firestore.rules', 'tool/deploy_firestore_rules.py', 'tool/rules-test/**', 'web-site/src/lib/onlineCore.js', '.github/workflows/rules.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar as regras no Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: lifelink-ad40f
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::Sem o segredo FIREBASE_SERVICE_ACCOUNT: as regras não foram publicadas (cole no Console do Firebase ou crie o segredo)."
            exit 0
          fi
          pip install --quiet google-auth requests
          python3 tool/deploy_firestore_rules.py
