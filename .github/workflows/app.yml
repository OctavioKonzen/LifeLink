name: App

# Confere o app Flutter em todo pull request (e na main): análise, testes e
# um APK de teste. Assim um erro de compilação aparece antes de ir para a main.

on:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'android/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/app.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'android/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/app.yml']

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: APK de teste (sem assinatura nem Firebase)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
